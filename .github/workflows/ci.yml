name: game-state CI

# On every push and PR: the test suite, and a check of the live public record
# using the SAME reconstruction and invariants the workflows gate on
# (js/engine.js → reconstruct). A hand-edited roster.md or results.md that
# no longer replays cleanly fails here, and it freezes every intake,
# acceptance and stage change until it's fixed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - name: Workflow files parse (including the private repo's templates)
        run: |
          python3 - <<'PY'
          import glob, yaml
          for f in sorted(glob.glob('.github/workflows/*.yml') + glob.glob('tentative/.github/workflows/*.yml')):
              yaml.safe_load(open(f)); print('ok', f)
          PY

  validate-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: The published record replays cleanly
        env:
          GH_TOKEN: ${{ github.token }}   # reads the public repos; the private queue is skipped (--public)
        run: node tools/advance.mjs check --public
