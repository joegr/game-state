name: game-state engine

# OPTIONAL CI path. The primary flow is the browser admin console (admin.html),
# which decrypts/tallies with the organizer key client-side and exports the
# config JSON for you to commit. This workflow is a convenience for running the
# same engine in CI on blobs you have committed under signups/ and scores/.
#
# It is manual-only (workflow_dispatch) — submissions arrive out-of-band as
# sealed blobs, not GitHub issues. Requires repo secret ORGANIZER_PRIVATE_KEY.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Engine action'
        type: choice
        required: true
        default: tally
        options: [draw, result, tally, sim, purge, status]
      match_id:
        description: 'Match id (for action=result), e.g. r8-m1'
        required: false
      winner_fp:
        description: 'Winner team code (for action=result)'
        required: false
      seed:
        description: 'Draw seed (optional, for action=draw)'
        required: false

permissions:
  contents: write   # commit updated JSON back to the repo

concurrency:
  group: game-state-engine
  cancel-in-progress: false

jobs:
  engine:
    runs-on: ubuntu-latest
    env:
      ORGANIZER_PRIVATE_KEY: ${{ secrets.ORGANIZER_PRIVATE_KEY }}
      ACTION: ${{ github.event.inputs.action }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Guard — private key present
        if: env.ORGANIZER_PRIVATE_KEY == ''
        run: |
          echo "::error::ORGANIZER_PRIVATE_KEY secret is not set. Add it in repo Settings → Secrets → Actions."
          exit 1

      # Operates on blobs committed under signups/ and scores/. Tools resolve paths
      # from repo root, so run from root.
      - name: Run engine action
        run: |
          set -euo pipefail
          echo "Action: $ACTION"
          MATCH_ID='${{ github.event.inputs.match_id }}'
          WINNER='${{ github.event.inputs.winner_fp }}'
          SEED='${{ github.event.inputs.seed }}'
          case "$ACTION" in
            draw)
              node tools/decrypt-signups.mjs
              if [ -n "$SEED" ]; then node tools/advance.mjs draw --seed "$SEED"; else node tools/advance.mjs draw; fi
              ;;
            result)
              node tools/advance.mjs result "$MATCH_ID" "$WINNER"
              node tools/advance.mjs tally || true
              ;;
            tally)
              node tools/decrypt-signups.mjs || true
              node tools/advance.mjs tally
              ;;
            sim)    node tools/advance.mjs sim ;;
            purge)  node tools/advance.mjs purge ;;
            status) node tools/advance.mjs status ;;
            *)      echo "Unknown action: $ACTION"; exit 1 ;;
          esac

      - name: Commit updated tournament JSON
        run: |
          set -euo pipefail
          git config user.name  "game-state[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A config signups scores state 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "engine: ${ACTION} @ $(date -u +%FT%TZ)"
            git push
          fi
