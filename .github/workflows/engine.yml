name: game-state engine

# The tournament state machine, run in CI. It owns the entire tournament as JSON
# in the repo: it collects signups, draws the bracket, records results, rewrites
# config/bracket.json on every mutation, and CASCADE-DELETES all stored data once
# the final match is decided. A change to config/bracket.json re-triggers the
# Pages deploy, so the served site always reflects the latest state.
#
# Requires repo secret ORGANIZER_PRIVATE_KEY (from `node keygen.mjs`).

on:
  # Event-driven ingestion: when a captain opens a signup / score issue, the
  # engine collects + tallies. No polling timer — the change itself triggers it.
  issues:
    types: [opened, reopened]
  # Manual control for draw / results / simulation / purge (from the admin dashboard).
  workflow_dispatch:
    inputs:
      action:
        description: 'Engine action'
        type: choice
        required: true
        default: collect
        options: [collect, draw, result, tally, sim, purge, status]
      match_id:
        description: 'Match id (for action=result), e.g. r8-m1'
        required: false
      winner_fp:
        description: 'Winner fingerprint (for action=result)'
        required: false
      seed:
        description: 'Draw seed (optional, for action=draw)'
        required: false

permissions:
  contents: write   # commit updated JSON back to the repo
  issues: write     # label + close collected signup issues

concurrency:
  group: game-state-engine
  cancel-in-progress: false

jobs:
  engine:
    runs-on: ubuntu-latest
    env:
      ORGANIZER_PRIVATE_KEY: ${{ secrets.ORGANIZER_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}
      ACTION: ${{ github.event.inputs.action || 'collect' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Guard — private key present
        if: env.ORGANIZER_PRIVATE_KEY == ''
        run: |
          echo "::error::ORGANIZER_PRIVATE_KEY secret is not set. Add it in repo Settings → Secrets → Actions."
          exit 1

      # The tools write to repo root (state/, config/, signups/, scores/), so run
      # from root. `gh` needs the `collected` label to exist before it can apply it.
      - name: Ensure collected label
        if: contains(fromJSON('["collect","draw","result","tally"]'), env.ACTION)
        run: gh label create collected --color ededed --description "game-state ingested" --force || true

      - name: Run engine action
        run: |
          set -euo pipefail
          echo "Action: $ACTION"
          MATCH_ID='${{ github.event.inputs.match_id }}'
          WINNER='${{ github.event.inputs.winner_fp }}'
          SEED='${{ github.event.inputs.seed }}'
          case "$ACTION" in
            collect)
              # Ingest signups and score reports, then refresh the queue.
              node tools/collect-issues.mjs --title signup --dir signups || true
              node tools/collect-issues.mjs --title score  --dir scores  || true
              node tools/decrypt-signups.mjs
              if [ -f state/matches.json ]; then node tools/advance.mjs tally; fi
              ;;
            draw)
              node tools/collect-issues.mjs --title signup --dir signups || true
              node tools/decrypt-signups.mjs
              if [ -n "$SEED" ]; then node tools/advance.mjs draw --seed "$SEED"; else node tools/advance.mjs draw; fi
              ;;
            result)
              node tools/advance.mjs result "$MATCH_ID" "$WINNER"
              # Refresh the queue so the confirmed match drops off (state/ is gone if this was the final).
              node tools/collect-issues.mjs --title score --dir scores || true
              node tools/advance.mjs tally || true
              ;;
            tally)
              node tools/collect-issues.mjs --title score --dir scores || true
              node tools/advance.mjs tally
              ;;
            sim)
              node tools/advance.mjs sim
              ;;
            purge)
              node tools/advance.mjs purge
              ;;
            status)
              node tools/advance.mjs status
              ;;
            *)
              echo "Unknown action: $ACTION"; exit 1 ;;
          esac

      - name: Commit updated tournament JSON
        run: |
          set -euo pipefail
          git config user.name  "game-state[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A config signups scores state 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "engine: ${ACTION} @ $(date -u +%FT%TZ)"
            git push
          fi
