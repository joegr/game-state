name: Deploy game-state to Pages

# Publishes the static site (index.html + js/ + css/ + config/) to GitHub
# Pages. Everything the visitor needs is static; the only durable state in
# THIS repo is config/tournament.md — no JSON anywhere. `config/**` below is
# a directory glob, so it already covers tournament.md (and any future file
# under config/) with no extension-specific listing to keep in sync.
#
# The roster repo (roster.md, results.md) is intentionally NOT wired to this
# workflow: the site fetches that markdown live at runtime (see
# js/config.js), so a roster/results change needs no redeploy here at all.

on:
  # Code pushes, and every stage change: stage.yml commits the new
  # config/tournament.md with PUBLISH_TOKEN (a personal token, so its push
  # triggers this, unlike a push made with a workflow's own GITHUB_TOKEN).
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'bracket.html'
      - 'captain.html'
      - '404.html'
      - 'css/**'
      - 'js/**'
      - 'config/**'
      - '.nojekyll'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deploy; let the running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Captains submit by dispatching the private repo's intake workflow, with
      # a token that can ONLY start workflows there and read their check
      # results (it cannot read or write any file). It lives in the SUBMIT_TOKEN
      # secret and is written into the PUBLISHED site here — never into git.
      # Without it, the site says submissions aren't connected yet.
      - name: Connect captain submissions
        env:
          SUBMIT_TOKEN: ${{ secrets.SUBMIT_TOKEN }}
        run: |
          repo="$(sed -n 's/^- Tentative repo: *//p' config/tournament.md)"
          if [ -z "$SUBMIT_TOKEN" ] || [ -z "$repo" ] || [ "$repo" = "(none)" ]; then
            echo "::warning::SUBMIT_TOKEN or Tentative repo not set — captains cannot submit on this deploy."
            exit 0
          fi
          # Refuse to publish the wrong token. The submit token must start
          # workflows in the private repo and must NOT read its files — a token
          # with Contents access here would hand the queue (and any write access
          # it has) to everyone who loads the site.
          probe() { curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $SUBMIT_TOKEN" "https://api.github.com/repos/$repo/$1"; }
          actions="$(probe actions/workflows)"; contents="$(probe contents/README.md)"
          if [ "$actions" != 200 ] || [ "$contents" = 200 ]; then
            echo "::error::SUBMIT_TOKEN is not a submit-only token (Actions: $actions, want 200; Contents: $contents, want 403/404). Not deploying it — fix the secret."
            exit 1
          fi
          REPO="$repo" node -e 'require("fs").writeFileSync("js/submit-config.js",
            "export const SUBMIT = { repo: " + JSON.stringify(process.env.REPO) + ", token: " + JSON.stringify(process.env.SUBMIT_TOKEN) + " };\n")'
          echo "submissions connected to $repo"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # Publish the repo root as-is — no build step.
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
