name: Deploy game-state to Pages

# Publishes the static site (index.html + js/ + css/ + config/) to GitHub
# Pages. Everything the visitor needs is static; the only durable state in
# THIS repo is config/tournament.md — no JSON anywhere. `config/**` below is
# a directory glob, so it already covers tournament.md (and any future file
# under config/) with no extension-specific listing to keep in sync.
#
# The roster repo (roster.md, results.md) is intentionally NOT wired to this
# workflow: the site fetches that markdown live at runtime (see
# js/config.js), so a roster/results change needs no redeploy here at all.

on:
  # Human edits to the site / config, made via `git push` or via
  # `tools/advance.mjs stage|draw` (both publish through `gh`, which is a
  # push like any other and triggers this the same way).
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'bracket.html'
      - 'captain.html'
      - 'report.html'
      - '404.html'
      - 'css/**'
      - 'js/**'
      - 'config/**'
      - '.nojekyll'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deploy; let the running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # Publish the repo root as-is — no build step.
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
