<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Off the bracket · game-state</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>" />
  <!-- Self-contained: GitHub Pages serves this file at the *missing* URL, so
       relative asset links (css/, js/) would resolve wrong. Everything is inline,
       and the "home" link is computed from the project base path at runtime. -->
  <style>
    :root { --bg:#f6f7f9; --panel:#fff; --ink:#16181d; --muted:#5b6470; --line:#e4e7ec; --accent:#4f46e5; --accent-ink:#fff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0e1014; --panel:#191c22; --ink:#e8eaed; --muted:#9aa4b2; --line:#2a2f38; --accent:#7c7bff; --accent-ink:#0e1014; }
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:var(--bg); color:var(--ink);
      font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    .box { background:var(--panel); border:1px solid var(--line); border-radius:14px;
      box-shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.05);
      padding:34px 30px; max-width:440px; margin:18px; text-align:center; }
    .logo { font-size:44px; }
    h1 { font-size:22px; letter-spacing:-.02em; margin:12px 0 2px; }
    .code { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--muted); font-size:13px; }
    p { color:var(--muted); }
    a.btn { display:inline-block; margin-top:14px; background:var(--accent); color:var(--accent-ink);
      text-decoration:none; font-weight:650; padding:10px 18px; border-radius:10px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">🎲</div>
    <div class="code">404</div>
    <h1>Off the bracket</h1>
    <p>That page isn’t part of this tournament.</p>
    <a class="btn" id="home" href="/">Back to the tournament →</a>
  </div>
  <script>
    // Point "home" at the project base (e.g. /game-state/ on a project Pages site,
    // / on a user/apex site) without hardcoding the repo name.
    (function () {
      var seg = location.pathname.split('/').filter(Boolean);
      var onGh = /\.github\.io$/.test(location.hostname);
      document.getElementById('home').href = (onGh && seg.length > 0) ? '/' + seg[0] + '/' : '/';
    })();
  </script>
</body>
</html>
